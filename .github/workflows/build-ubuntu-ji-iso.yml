name: Build SolOS Ubuntu JI ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "appliance/ubuntu-ji/**"
      - ".github/workflows/build-ubuntu-ji-iso.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap dctrl-tools xorriso grub-pc-bin squashfs-tools rsync
      - name: Build non-destructive live ISO
        run: sudo SOLOS_REPO="$GITHUB_WORKSPACE" ./appliance/ubuntu-ji/build-iso.sh
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: solos-ubuntu-ji-amd64
          path: |
            appliance/ubuntu-ji/out/solos-ubuntu-ji-amd64.iso
            appliance/ubuntu-ji/out/solos-ubuntu-ji-amd64.iso.sha256
          compression-level: 0
          retention-days: 14
